apiVersion: v1
kind: ConfigMap
metadata:
  name: lomax-config
  namespace: lomax
data:
  AWS_ENDPOINT_URL: "http://floci:4566"
  DB_HOST: "floci"
  DB_PORT: "7001"
  DB_USER: "admin"
  DB_NAME: "lomax"
  BUCKET_ORIGINALES: "lomax-originales"
  BUCKET_MINIATURAS: "lomax-miniaturas"
  TABLA_ATRIBUTOS: "productos_atributos"
  LAMBDA_NAME: "lomax-miniatura"
---
apiVersion: v1
kind: Secret
metadata:
  name: lomax-secret
  namespace: lomax
type: Opaque
stringData:
  DB_PASSWORD: "admin12345"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lomax
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      hostAliases:
        - ip: "172.19.0.2"
          hostnames: ["floci"]
      containers:
        - name: backend
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/lomax-backend:5cb1d38
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: {name: lomax-config}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: lomax-secret, key: DB_PASSWORD}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lomax
spec:
  selector: {app: backend}
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lomax
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/lomax-frontend:5cb1d38
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lomax
spec:
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: lomax
spec:
  replicas: 1
  selector:
    matchLabels: {app: proxy}
  template:
    metadata:
      labels: {app: proxy}
    spec:
      containers:
        - name: proxy
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: conf
          configMap:
            name: proxy-conf
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: lomax
spec:
  selector: {app: proxy}
  ports:
    - port: 80
      targetPort: 80